<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreras · ISFDyT N.º 166</title>
<meta name="description" content="Carreras del ISFDyT N.º 166: planes de estudio y correlatividades.">
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --text: #0f1722;
    --muted: #3f4a5a;
    --line: #b9c2cf;
    --accent: #1a5896;
    --general: #1f63c9;
    --fundamento: #7a3fc4;
    --tecnico: #0b7d5e;
    --practica: #c46a00;
    --sel: #0f1722;
    --sel-text: #ffffff;
    --req-bg: #ffd84d;
    --req-line: #8a6500;
    --hab-bg: #7fdc9b;
    --hab-line: #0d6b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1218;
      --card: #171d26;
      --text: #f2f5f9;
      --muted: #c0c9d6;
      --line: #46526a;
      --accent: #8ec0f5;
      --general: #6aa6ff;
      --fundamento: #b999f5;
      --tecnico: #3fd6a8;
      --practica: #ffb04d;
      --sel: #f2f5f9;
      --sel-text: #0e1218;
      --req-bg: #7a5d00;
      --req-line: #ffd84d;
      --hab-bg: #14683a;
      --hab-line: #6fe39a;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; -webkit-text-size-adjust: 100%; }
  @media (max-width: 640px) { html { font-size: 18px; } }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.35;
  }
  header { padding: 24px 12px 6px; text-align: center; }
  header h1 { margin: 0; font-size: 1.7rem; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px; }

  /* Inicio: botones de carreras */
  .carreras { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
  .carrera-btn {
    background: var(--card); color: var(--text); border: 2px solid var(--line);
    border-radius: 12px; padding: 20px 24px; font: inherit; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; min-width: 240px; max-width: 360px; text-align: center;
  }
  .carrera-btn small { display: block; font-weight: 500; font-size: .9rem; color: var(--muted); margin-top: 6px; }
  .carrera-btn:hover, .carrera-btn:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* Plan */
  .volver {
    background: none; border: none; color: var(--accent); font: inherit; font-weight: 600;
    cursor: pointer; padding: 8px 0; margin-bottom: 4px;
  }
  h2 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.2; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 10px; font-size: .92rem; color: var(--text); }
  .leyenda span { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .nota { margin: 0 0 14px; font-size: .88rem; color: var(--muted); }
  .ayuda { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 1rem; min-height: 52px; }
  .ayuda b { font-weight: 700; }
  .ayuda .tip { margin-top: 8px; font-size: .88rem; color: var(--muted); }

  .anio { background: var(--card); border: 2px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .anio h3 { margin: 0; padding: 10px 14px; background: color-mix(in srgb, var(--accent) 22%, var(--card)); font-size: 1.15rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .anio h3 span { font-weight: 500; color: var(--muted); font-size: .95rem; }

  /* Ancho proporcional a la carga horaria (64 hs = 1, 128 hs = 2, 192 hs = 3).
     Con flex las filas se llenan solas y no quedan huecos. */
  .materias { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
  .materia {
    flex: var(--u, 1) 1 calc(var(--u, 1) * 150px); min-width: 0;
    text-align: left; font: inherit; color: var(--text);
    background: color-mix(in srgb, var(--c) 13%, var(--card));
    border: 2px solid color-mix(in srgb, var(--c) 55%, var(--card));
    border-left: 8px solid var(--c);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; min-height: 84px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    hyphens: auto; overflow-wrap: anywhere;
    transition: opacity .15s, background .15s;
  }
  .materia .nom { font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
  .materia .hs { font-size: .9rem; color: var(--muted); font-weight: 500; }
  .materia:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .materia[data-campo="General"] { --c: var(--general); }
  .materia[data-campo="Fundamento"] { --c: var(--fundamento); }
  .materia[data-campo="Técnico Específico"] { --c: var(--tecnico); }
  .materia[data-campo="Práctica"] { --c: var(--practica); }

  /* Celular: 2 columnas; 64 hs = media fila, 128 y 192 hs = fila completa */
  @media (max-width: 640px) {
    main { padding: 10px; }
    .materias { gap: 6px; }
    .materia { min-height: 80px; padding: 9px 8px 9px 9px; border-left-width: 6px; }
    .materia .nom { font-size: 1rem; }
    .materias { padding: 8px 6px; }
    .materia[data-u="1"] { flex: 1 1 calc(50% - 3px); }
    .materia:not([data-u="1"]) { flex: 1 1 100%; }
    .materia[data-u="3"] { min-height: 112px; }
  }

  .con-seleccion .materia { opacity: .42; }
  .con-seleccion .materia.sel, .con-seleccion .materia.req, .con-seleccion .materia.hab { opacity: 1; }
  .materia.sel { background: var(--sel); color: var(--sel-text); border-color: var(--sel); border-left-color: var(--c); }
  .materia.sel .hs { color: var(--sel-text); opacity: .85; }
  .materia.req { background: var(--req-bg); border-color: var(--req-line); border-left-color: var(--req-line); }
  .materia.hab { background: var(--hab-bg); border-color: var(--hab-line); border-left-color: var(--hab-line); }
  .materia.req .hs, .materia.hab .hs { color: var(--text); }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px 12px 36px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>ISFDyT N.º 166</h1>
  <p id="subtitulo">Nuestras carreras</p>
</header>

<main>
  <section id="inicio">
    <div class="carreras" id="listaCarreras"></div>
  </section>

  <section id="plan" hidden>
    <button class="volver" id="volver" type="button">← Volver a las carreras</button>
    <h2 id="tituloCarrera"></h2>
    <p class="sub" id="subCarrera"></p>

    <div class="leyenda" id="leyenda"></div>
    <p class="nota">El tamaño de cada rectángulo es proporcional a su carga horaria.</p>
    <div class="ayuda" id="ayuda" aria-live="polite"></div>
    <div id="anios"></div>
  </section>
</main>

<footer>Información orientativa. Consultá el plan oficial en el instituto.</footer>

<!-- ============================================================
     DATOS: para agregar otra carrera, copiá un bloque dentro de
     "carreras" y cambiá el contenido. Cada materia tiene:
       id          identificador único (sin espacios)
       nombre      como se muestra
       hs          horas
       campo       General | Fundamento | Técnico Específico | Práctica
       correlativas  lista de ids que deben estar aprobadas
     ============================================================ -->
<script type="application/json" id="datos">
{
  "carreras": [
    {
      "id": "analisis-de-sistemas",
      "nombre": "Tecnicatura Superior en Análisis de Sistemas",
      "duracion": "3 años",
      "anios": [
        {
          "titulo": "1.º año",
          "materias": [
            { "id": "ingles1", "nombre": "Inglés I", "hs": 64, "campo": "General", "correlativas": [] },
            { "id": "cts", "nombre": "Ciencia, Tecnología y Sociedad", "hs": 64, "campo": "General", "correlativas": [] },
            { "id": "am1", "nombre": "Análisis Matemático I", "hs": 64, "campo": "Fundamento", "correlativas": [] },
            { "id": "algebra", "nombre": "Álgebra", "hs": 64, "campo": "Fundamento", "correlativas": [] },
            { "id": "aed1", "nombre": "Algoritmos y estructuras de datos I", "hs": 128, "campo": "Técnico Específico", "correlativas": [] },
            { "id": "syo", "nombre": "Sistemas y Organizaciones", "hs": 64, "campo": "Técnico Específico", "correlativas": [] },
            { "id": "arq", "nombre": "Arquitectura de Computadores", "hs": 64, "campo": "Técnico Específico", "correlativas": [] },
            { "id": "pp1", "nombre": "Prácticas Profesionalizantes I", "hs": 64, "campo": "Práctica", "correlativas": [] }
          ]
        },
        {
          "titulo": "2.º año",
          "materias": [
            { "id": "ingles2", "nombre": "Inglés II", "hs": 64, "campo": "General", "correlativas": ["ingles1"] },
            { "id": "am2", "nombre": "Análisis Matemático II", "hs": 64, "campo": "Fundamento", "correlativas": ["am1", "algebra"] },
            { "id": "estadistica", "nombre": "Estadística", "hs": 64, "campo": "Fundamento", "correlativas": ["am1", "algebra"] },
            { "id": "is1", "nombre": "Ingeniería de Software I", "hs": 64, "campo": "Técnico Específico", "correlativas": ["syo"] },
            { "id": "aed2", "nombre": "Algoritmos y estructuras de datos II", "hs": 128, "campo": "Técnico Específico", "correlativas": ["aed1"] },
            { "id": "so", "nombre": "Sistemas Operativos", "hs": 64, "campo": "Técnico Específico", "correlativas": ["arq"] },
            { "id": "bd", "nombre": "Base de Datos", "hs": 64, "campo": "Técnico Específico", "correlativas": ["aed1"] },
            { "id": "pp2", "nombre": "Prácticas Profesionalizantes II", "hs": 128, "campo": "Práctica", "correlativas": ["pp1", "syo"] }
          ]
        },
        {
          "titulo": "3.º año",
          "materias": [
            { "id": "ingles3", "nombre": "Inglés III", "hs": 64, "campo": "General", "correlativas": ["ingles2"] },
            { "id": "legales", "nombre": "Aspectos legales de la Profesión", "hs": 64, "campo": "Fundamento", "correlativas": [] },
            { "id": "seminario", "nombre": "Seminario de actualización", "hs": 64, "campo": "Técnico Específico", "correlativas": [] },
            { "id": "redes", "nombre": "Redes y Comunicaciones", "hs": 64, "campo": "Técnico Específico", "correlativas": ["so"] },
            { "id": "is2", "nombre": "Ingeniería de Software II", "hs": 64, "campo": "Técnico Específico", "correlativas": ["is1"] },
            { "id": "aed3", "nombre": "Algoritmos y estructuras de datos III", "hs": 128, "campo": "Técnico Específico", "correlativas": ["aed2", "am1"] },
            { "id": "pp3", "nombre": "Prácticas Profesionalizantes III", "hs": 192, "campo": "Práctica", "correlativas": ["pp2", "aed2", "bd", "is1"] }
          ]
        }
      ]
    }
  ]
}
</script>

<script>
(function () {
  var DATOS = JSON.parse(document.getElementById('datos').textContent);
  var CAMPOS = {
    'General': 'var(--general)',
    'Fundamento': 'var(--fundamento)',
    'Técnico Específico': 'var(--tecnico)',
    'Práctica': 'var(--practica)'
  };
  var AYUDA_INICIAL = 'Tocá una materia para ver sus correlativas.';

  var $ = function (id) { return document.getElementById(id); };
  var inicio = $('inicio'), plan = $('plan'), anios = $('anios'), ayuda = $('ayuda');
  var carreraActual = null, seleccion = null, porId = {};

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  // ---------- Inicio ----------
  function dibujarInicio() {
    var lista = $('listaCarreras');
    lista.innerHTML = '';
    DATOS.carreras.forEach(function (c) {
      var b = el('button', 'carrera-btn', c.nombre);
      b.type = 'button';
      b.appendChild(el('small', null, 'Duración: ' + c.duracion));
      b.addEventListener('click', function () { location.hash = '#/' + c.id; });
      lista.appendChild(b);
    });
  }

  // ---------- Plan ----------
  function mostrarCarrera(c) {
    carreraActual = c; seleccion = null; porId = {};
    c.anios.forEach(function (a) { a.materias.forEach(function (m) { porId[m.id] = m; }); });

    $('tituloCarrera').textContent = c.nombre;
    $('subCarrera').textContent = 'Duración: ' + c.duracion;

    var ley = $('leyenda');
    ley.innerHTML = '';
    Object.keys(CAMPOS).forEach(function (k) {
      var s = el('span');
      var d = el('i', 'dot'); d.style.background = CAMPOS[k];
      s.appendChild(d); s.appendChild(document.createTextNode('Campo ' + (k === 'General' ? 'General' : k === 'Fundamento' ? 'del Fundamento' : k === 'Práctica' ? 'de la Práctica' : 'Técnico Específico')));
      ley.appendChild(s);
    });

    anios.innerHTML = '';
    c.anios.forEach(function (a) {
      var total = a.materias.reduce(function (s, m) { return s + m.hs; }, 0);
      var sec = el('section', 'anio');
      var h = el('h3', null, a.titulo);
      h.appendChild(el('span', null, 'Total: ' + total + ' hs'));
      sec.appendChild(h);
      var grid = el('div', 'materias');
      a.materias.forEach(function (m) {
        var b = el('button', 'materia');
        b.type = 'button';
        b.dataset.id = m.id;
        b.dataset.campo = m.campo;
        var u = Math.max(1, Math.round(m.hs / 64));
        b.style.setProperty('--u', u);
        b.dataset.u = u;
        b.appendChild(el('span', 'nom', m.nombre));
        b.appendChild(el('span', 'hs', m.hs + ' hs'));
        b.addEventListener('click', function () { elegir(m.id); });
        grid.appendChild(b);
      });
      sec.appendChild(grid);
      anios.appendChild(sec);
    });
    pintar();
  }

  function elegir(id) {
    seleccion = (seleccion === id) ? null : id;
    pintar();
  }

  function nombres(ids) {
    return ids.map(function (i) { return porId[i].nombre; }).join(', ');
  }

  function pintar() {
    var req = [], hab = [];
    if (seleccion) {
      req = porId[seleccion].correlativas;
      Object.keys(porId).forEach(function (id) {
        if (porId[id].correlativas.indexOf(seleccion) !== -1) hab.push(id);
      });
    }
    anios.classList.toggle('con-seleccion', !!seleccion);
    var botones = anios.querySelectorAll('.materia');
    for (var i = 0; i < botones.length; i++) {
      var b = botones[i], id = b.dataset.id;
      b.classList.toggle('sel', id === seleccion);
      b.classList.toggle('req', req.indexOf(id) !== -1);
      b.classList.toggle('hab', hab.indexOf(id) !== -1);
      b.setAttribute('aria-pressed', id === seleccion ? 'true' : 'false');
    }

    ayuda.innerHTML = '';
    if (!seleccion) { ayuda.textContent = AYUDA_INICIAL; return; }
    var m = porId[seleccion];
    var p1 = el('div');
    p1.appendChild(el('b', null, m.nombre + ': '));
    p1.appendChild(document.createTextNode(req.length
      ? 'para aprobarla necesitás tener aprobada ' + nombres(req) + '.'
      : 'no tiene correlativas previas.'));
    ayuda.appendChild(p1);
    var p2 = el('div');
    p2.appendChild(document.createTextNode(hab.length
      ? 'Es requisito para: ' + nombres(hab) + '.'
      : 'No es requisito de ninguna otra materia.'));
    ayuda.appendChild(p2);
    var p3 = el('div');
    p3.className = 'tip';
    p3.textContent = 'Amarillo: la tenés que tener aprobada antes. Verde: la habilita. Tocá de nuevo para limpiar.';
    ayuda.appendChild(p3);
  }

  // ---------- Navegación por hash (#/id-de-carrera) ----------
  function ruta() {
    var id = location.hash.replace(/^#\//, '');
    var c = DATOS.carreras.filter(function (x) { return x.id === id; })[0];
    if (c) {
      inicio.hidden = true; plan.hidden = false;
      document.title = c.nombre + ' · ISFDyT N.º 166';
      mostrarCarrera(c);
      window.scrollTo(0, 0);
    } else {
      plan.hidden = true; inicio.hidden = false;
      document.title = 'Carreras · ISFDyT N.º 166';
    }
  }

  $('volver').addEventListener('click', function () { location.hash = ''; });
  window.addEventListener('hashchange', ruta);
  dibujarInicio();
  ruta();
})();
</script>
</body>
</html>
